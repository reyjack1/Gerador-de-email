<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritor de Email</title>

<script src="jquery.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f9;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* Container */
.pesquisa-box {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    width: 100%;
    max-width: 400px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.pesquisa-box h3 {
    margin-bottom: 15px;
    text-align: center;
}

/* Inputs */
input, select {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;

    border: 1px solid #ccc;
    border-radius: 5px;
}

input:focus, select:focus {
    border-color: #007bff;
    outline: none;
}

/* Botão adicionar defeito */
#add-defeito {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;

    background-color: #28a745;
    color: #fff;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

#add-defeito:hover {
    background-color: #218838;
}

/* Botões */
.btn {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    background-color: #007bff;
    color: white;
    cursor: pointer;
}

button:hover {
    background-color: #0056b3;
}

#clear-fields {
    background-color: #6c757d;
}

#clear-fields:hover {
    background-color: #4b545c;
}

/* Email */
#email-container {
    margin-top: 20px;
    background: #fff;
    padding: 15px;
    border-radius: 10px;

    max-width: 400px;
    width: 100%;

    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    white-space: pre-line;
}

/* Voltar */
a {
    position: absolute;
    top: 20px;
    left: 20px;

    background: #007bff;
    color: white;
    padding: 8px 15px;
    border-radius: 5px;
    text-decoration: none;
}

/* =========================
   TABLET
========================= */
@media (max-width: 768px) {

    body {
        padding: 15px;
        align-items: flex-start;
    }

    a {
        top: 12px;
        left: 12px;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 0.9rem;
    }

    .pesquisa-box {
        max-width: 100%;
        width: 100%;
        padding: 22px 18px;
        border-radius: 16px;
    }

    .pesquisa-box h3 {
        font-size: 1.2rem;
    }

    input,
    select {
        padding: 14px;
        font-size: 1rem;
        border-radius: 10px;
    }

    #add-defeito {
        padding: 12px;
        border-radius: 10px;
        font-size: 0.95rem;
    }

    .btn {
        flex-direction: column;
        width: 100%;
    }

    .btn button {
        width: 100%;
        padding: 14px;
        font-size: 1rem;
        border-radius: 12px;
    }

    #email-container {
        margin-top: 18px;
        max-width: 100%;
        padding: 18px;
        border-radius: 16px;
        overflow-x: auto;
    }

    #email {
        font-size: 0.95rem;
        line-height: 1.6;
    }
}

/* =========================
   CELULAR
========================= */
@media (max-width: 480px) {

    body {
        background: #eef2f7;
        padding: 12px;
    }

    .pesquisa-box {
        padding: 18px 14px;
        box-shadow: none;
    }

    .pesquisa-box h3 {
        font-size: 1rem;
        margin-bottom: 18px;
    }

    input,
    select {
        padding: 15px;
        font-size: 0.95rem;
        margin-bottom: 12px;
    }

    label {
        font-size: 0.9rem;
        margin-bottom: 6px;
        display: block;
    }

    #add-defeito {
        font-weight: bold;
    }

    .btn {
        gap: 12px;
    }

    .btn button {
        font-size: 0.95rem;
        font-weight: bold;
    }

    #email-container {
        background: #ffffff;
        padding: 16px;
        border-radius: 14px;
    }

    #email {
        font-size: 0.92rem;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
    }

    a {
        position: fixed;
        z-index: 999;
    }
}
</style>
</head>

<body>

<a href="index.html">Voltar</a>

<div>
    <div class="pesquisa-box">
        <h3>Preencha as informações</h3>

        <input type="text" id="inputCodigo" placeholder="Código do produto">
        <input type="text" id="inputDescricao" placeholder="Descrição / Modelo">

        <div id="defeitos-container">
            <input type="text" class="inputDefeito" placeholder="Descreva o defeito">
        </div>

        <button type="button" id="add-defeito">+ Adicionar defeito</button>

        <label>Ação:</label>
        <select id="selectAcao">
            <option value="troca">Troca</option>
            <option value="reparo">Reparo</option>
            <option value="reparo e troca">Reparo e Troca</option>
        </select>
    </div>

    <div class="btn">
        <button id="generator-email">Gerar email</button>
        <button id="copy-email">Copiar email</button>
        <button id="clear-fields">Limpar</button>
    </div>

    <div id="email-container">
        <p id="email"></p>
    </div>
</div>

<script>
$(document).ready(function () {

    function obterDados() {
        let defeitos = [];

        $(".inputDefeito").each(function () {
            let valor = $(this).val().trim();
            if (valor !== "") {
                defeitos.push(valor);
            }
        });

        return {
            codigo: $("#inputCodigo").val().trim(),
            descricao: $("#inputDescricao").val().trim(),
            defeitos: defeitos,
            acao: $("#selectAcao").val()
        };
    }

    function montarListaDefeitos(defeitos) {
        if (defeitos.length === 0) return "- Nenhum defeito informado";
        return defeitos.map(d => `- ${d}`).join("\n");
    }

    function montarEmail({ codigo, descricao, defeitos, acao }) {
        return `Prezado(a),

Informamos que o produto modelo ${descricao}
(código: ${codigo}) apresentou o(s) seguinte(s) defeito(s):

${montarListaDefeitos(defeitos)}

Diante disso, realizamos a ${acao} do equipamento.

Agradecemos a atenção,

RMA.`;
    }

    function atualizarEmail() {
        const dados = obterDados();
        const email = montarEmail(dados);
        $("#email").text(email);
    }

    function copiarEmail() {
        const texto = $("#email").text();

        navigator.clipboard.writeText(texto)
            .then(() => alert("Email copiado com sucesso!"))
            .catch(() => alert("Erro ao copiar."));
    }

    function limparCampos() {
        $("#inputCodigo").val("");
        $("#inputDescricao").val("");
        $("#defeitos-container").html('<input type="text" class="inputDefeito" placeholder="Descreva o defeito">');
        $("#selectAcao").val("troca");
        $("#email").text("");
    }

    // Adicionar defeito
    $("#add-defeito").click(function () {
        $("#defeitos-container").append(
            '<input type="text" class="inputDefeito" placeholder="Descreva outro defeito">'
        );
    });

    // Eventos
    $("#generator-email").click(atualizarEmail);
    $("#copy-email").click(copiarEmail);
    $("#clear-fields").click(limparCampos);

    $(document).on("keypress", "input", function (event) {
        if (event.which === 13) {
            event.preventDefault();
            atualizarEmail();
        }
    });

});
</script>

</body>
</html>
