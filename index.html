<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escritor de Email</title>
<link rel="icon" href="caminho/para/seu-icone.ico" type="image/x-icon">
<link rel="stylesheet" type="text/css" href="style2.css">
<meta name="description" content="Uma breve descrição da minha página">
<meta name="keywords" content="palavras-chave, separadas, por, vírgulas">
<script type="text/javascript" src="jquery.js"></script>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #111827;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    overflow: hidden;
}

/* NAV */
nav {
    display: flex;
    width: 100%;
    min-height: 100vh;
}

/* CARDS */
nav .teams,
nav .email {
    flex: 1;

    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;

    cursor: pointer;

    transition: all 0.3s ease;

    position: relative;
    overflow: hidden;
}

/* TEAMS */
nav .teams {
    background: linear-gradient(135deg, #0284c7, #03adfc);
    border-right: 2px solid rgba(255,255,255,0.08);
}

/* EMAIL */
nav .email {
    background: linear-gradient(135deg, #dc2626, #fc2803);
}

/* TEXTO */
nav span {
    font-size: 2rem;
    font-weight: bold;
    color: white;
    z-index: 2;
    transition: 0.3s;
    text-align: center;
    padding: 20px;
    pointer-events: none;
}

/* EFEITO HOVER */
nav .teams:hover,
nav .email:hover {
    transform: scale(1.02);
    filter: brightness(1.08);
}

/* EFEITO DE LUZ */
nav .teams::before,
nav .email::before {
    content: '';

    position: absolute;

    width: 300px;
    height: 300px;

    background: rgba(255,255,255,0.08);

    border-radius: 50%;

    top: -100px;
    right: -100px;

    transition: 0.4s ease;
}

nav .teams:hover::before,
nav .email:hover::before {
    transform: scale(1.3);
}

/* =========================
   TABLET
========================= */
@media (max-width: 768px) {

    nav span {
        font-size: 1.5rem;
    }
}

/* =========================
   CELULAR
========================= */
@media (max-width: 600px) {

    body {
        overflow-y: auto;
    }

    nav {
        flex-direction: column;
    }

    nav .teams,
    nav .email {
        min-height: 50vh;
        width: 100%;
    }

    nav .teams {
        border-right: none;
        border-bottom: 2px solid rgba(255,255,255,0.08);
    }

    nav span {
        font-size: 1.3rem;
        padding: 15px;
    }

    nav .teams:hover,
    nav .email:hover {
        transform: none;
    }
}

/* =========================
   CELULAR PEQUENO
========================= */
@media (max-width: 400px) {

    nav span {
        font-size: 1.1rem;
    }
}
</style>

</head>
<body>

<nav>
    <div class="teams" onclick="window.location.href='teams.html'">
        <span>Email para Teams</span>
    </div>
    <div class="email" onclick="window.location.href='email.html'">
        <span>Email para Estoque</span>
    </div>
</nav>

</body>
</html>
